[package]
name = "ime-wasm"
description = "WASM bindings for the Hangul→Japanese conversion engine (homepage demo)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ime-db = { path = "../db", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
